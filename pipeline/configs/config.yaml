    stage_1_labels_aware_dir: inference/stage2/labels
    stage_1_labels_agnostic_dir: inference/stage_1/labels_agnostic
    stage_2_images_dir: inference/stage2/images
    stage_2_labels_aware_dir: inference/stage2/labels
  processed:
    stage_1:
      class_agnostic_patches_dir: processed/stage_1/patches_class_agnostic
      class_aware_patches_dir: processed/stage_1/patches_class_aware
